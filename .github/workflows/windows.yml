name: Windows

# Windows is a tier-2 platform: this job reports, but does not block.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows (tier 2)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK and libadwaita (MSYS2)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita

      - name: Install SBCL
        shell: pwsh
        run: choco install sbcl -y --no-progress

      - name: Install Quicklisp
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\Steel Bank Common Lisp;$env:PATH"
          Invoke-WebRequest https://beta.quicklisp.org/quicklisp.lisp -OutFile quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp --eval "(quicklisp-quickstart:install)"
          Set-Content -Path "$env:USERPROFILE\.sbclrc" -Value '(load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))'
          sbcl --non-interactive --eval "(ql:quickload (list :cffi :alexandria :plump :parachute) :silent t)"

      - name: Tests
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\Steel Bank Common Lisp;${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          $env:GTK4_LISP_LIBRARY_PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          $env:XDG_DATA_DIRS = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\share"
          sbcl --dynamic-space-size 4096 --non-interactive `
            --eval '(push (truename ".") asdf:*central-registry*)' `
            --eval '(ql:quickload :gtk4-tests :silent t)' `
            --eval '(uiop:quit (if (eq :passed (parachute:status (parachute:test :gtk4-tests))) 0 1))'
